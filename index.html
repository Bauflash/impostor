  display:flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

h1 {
  margin-bottom: 20px;

  text-align:center;

.card {
  width: 90%;          /* casi todo el ancho de pantalla */

  padding: 30px 20px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);

}

.botones {
  width: 100%;          /* botones grandes para tocar con el dedo */

  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 10px;
}


button {
  width: 100%;          /* botones grandes para tocar con el dedo */
  padding: 15px 15px;
  font-size: 1.3em;
  margin: 10px 0;      /* espacio vertical entre botones */
  background: #6c63ff;
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

button:hover {
  background: #5750c3;
  transform: scale(1.05);
}

let modoSorpresa = false;
let palabra;
let impostores = [];
let jugador = 1;
let total = 0;
let mostrando = false;
let iniciado = false;
let terminado = false;

function play() {
    total = Number(document.getElementById("jugadores").value);
    let cant = Number(document.getElementById("impostores").value);

    if (cant >= total) {
        alert("Impostores deben ser menos que jugadores");
        return;
    }

    // Elegir palabra al azar
    palabra = objetos[Math.floor(Math.random() * objetos.length)];

    // Elegir impostores
    impostores = [];
    while (impostores.length < cant) {
        let r = Math.floor(Math.random() * total) + 1;
        if (!impostores.includes(r)) impostores.push(r);
    }

    // Modo sorpresa 5%
    if (modoSorpresa && Math.random() < 0.05) {
        impostores = [];
        for (let i = 1; i <= total; i++) impostores.push(i);
    }

    jugador = 1;
    mostrando = false;
    iniciado = true;
    terminado = false;

    // Ocultar inputs
    document.getElementById("config").style.display = "none";

    // Mostrar primer jugador
    const pantalla = document.getElementById("pantalla");
    pantalla.innerHTML = "Jugador 1<br>Tocá SIGUIENTE";
    pantalla.style.background = "rgba(255,255,255,0.1)";
}

function siguiente() {
    if (!iniciado) {
        alert("Primero tocá PLAY");
        return;
    }

    const pantalla = document.getElementById("pantalla");

    // Si ya terminó el juego, reiniciamos
    if (terminado) {
        document.getElementById("config").style.display = "block";
        pantalla.innerHTML = "Presioná PLAY";
        pantalla.style.background = "rgba(255,255,255,0.1)";
        iniciado = false;
        return;
    }

    // Mostrar palabra del jugador actual
    if(!mostrando){

    // Mostrar palabra o impostor
    if(impostores.includes(jugador)){
        document.getElementById("pantalla").style.background = "rgba(255,0,0,0.3)";
        document.getElementById("pantalla").innerHTML = "SOS IMPOSTOR<br>" + palabra.tema;
    } else {
        document.getElementById("pantalla").style.background = "rgba(0,255,0,0.3)";
        document.getElementById("pantalla").innerHTML = "Tu palabra:<br>" + palabra.nombre;
    }

    mostrando = true;

    // Si es el último jugador, marcamos terminado y mostramos listo
    if(jugador === total){
        terminado = true;
        document.getElementById("pantalla").innerHTML = "LISTO<br>A JUGAR";
        document.getElementById("pantalla").style.background = "rgba(255,255,255,0.1)";
    }

    } else {
        // Para jugadores anteriores
        jugador++;
        mostrando = false;
        document.getElementById("pantalla").style.background = "rgba(255,255,255,0.1)";
        if(jugador <= total){
            document.getElementById("pantalla").innerHTML = "Jugador " + jugador + "<br>Tocá SIGUIENTE";
        }
    }
}

function toggleSorpresa() {
    modoSorpresa = !modoSorpresa;
    document.getElementById("sorpresaBtn").innerHTML =
        modoSorpresa ? "Modo Sorpresa ✅" : "Modo Sorpresa ⬜";
}
