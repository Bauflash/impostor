<title>Impostor Game</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui;
background:#000;
color:white;
display:flex;
flex-direction:column;
align-items:center;
padding:5vw;
}

h1{margin-bottom:25px}

/* MAIN CARD */
.card {
  width: 90%;        /* ocupa el 90% del ancho del dispositivo */
  max-width: 400px;  /* no se haga demasiado grande en tablets */
  background: rgba(255,255,255,.05);
  backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 0 40px rgba(130,80,255,.4);
}


/* OVAL ROW */
.oval{
display:flex;
align-items:center;
gap:10px;
background:#0b0b0b;
border:1px solid rgba(150,100,255,.5);
border-radius:999px;
padding:2vh 4vw;
margin-bottom:8px;
font-size:1em;
}

.oval span{
opacity:.85;
}

.oval input,
#surpriseBox{
margin-left:auto;
}

/* NUMBERS */
input{
width:45px;
background:none;
border:none;
color:white;
text-align:right;
font-size:1.1em;
outline:none;
}

/* remove arrows */
input::-webkit-inner-spin-button,
input::-webkit-outer-spin-button{
-webkit-appearance:none;
margin: 0;
}
input[type=number]{-moz-appearance:textfield}


/* opcional: ancho completo para que toque fácil en móvil */
input[type=number] {
  width: 100%;
}

/* SURPRISE */
#surpriseBox{
width:22px;
height:22px;
border-radius:6px;
border:1px solid rgba(150,100,255,.7);
}
#surpriseBox.active{
background:#8f6bff;
}

/* PLAY */
#playBtn{
display:block;
margin:18px auto 0;
padding:2vh 5vw;
border:none;
border-radius:16px;
font-size:1em;
background:linear-gradient(135deg,#6f4cff,#3a1fa3);
color:white;
cursor:pointer;
}

/* GAME */
#nextBtn{
margin-top:15px;
padding:2vh 5vw;
font-size:1em;
width:110px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#6f4cff,#3a1fa3);
color:white;
visibility:hidden;
text-align:center;
cursor:pointer;
}

#pantalla {
  margin-top: 25px;
  width: 90%;
  max-width: 400px;
  min-height: 120px;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: 26px;
  font-size: 1.5em;
  flex-direction: column;
}


#roleBadge{
display:none;
margin:10px 0 14px;
padding:10px 26px;
border-radius:999px;
border:1px solid rgba(150,100,255,.7);
font-size:1.1em;
letter-spacing:.08em;
}

.hintTitle{
font-size:.65em;
opacity:.6;
margin-bottom:10px;
letter-spacing:.08em;
}

.hintText{
font-size:1.2em;
}

.hint{
margin-top:2px;
font-size:.65em;
opacity:.7;
text-align:center;
}

.tema{
margin-top:20px;
font-size:1.2em;
text-align:center;
}
</style>
</head>

<h1>Impostor Game</h1>

<div id="roleBadge">IMPOSTOR</div>

<div id="config" class="card">

<div class="oval">
<span>Players</span>
<input id="jugadores" type="number" min="2" value="5">
</div>

<div class="oval">
<span>Impostors</span>
<input id="impostores" type="number" min="1" value="1">
</div>

<div class="oval" onclick="toggleSorpresa()">
<span>Surprise Mode</span>
<div id="surpriseBox"></div>
</div>

<button id="playBtn">PLAY</button>

<div id="pantalla" class="card"></div>

// ---------- VARIABLES ----------
let modo=false;
let palabra;
let imps=[];
let jugador=0;
let total=0;
let mostrando=false;

const surpriseBox = document.getElementById("surpriseBox");
const playBtn = document.getElementById("playBtn");
const nextBtn = document.getElementById("nextBtn");
const pantalla = document.getElementById("pantalla");
const roleBadge = document.getElementById("roleBadge");
const config = document.getElementById("config");
const jugadores = document.getElementById("jugadores");
const impostores = document.getElementById("impostores");
const numInputs = document.querySelectorAll('input[type=number]');

numInputs.forEach(input => {
  input.addEventListener('keydown', e => {
    if(['ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
  });
  // Evitar scroll del mouse/touch
  input.addEventListener('wheel', e => e.preventDefault());
});


// ---------- EVENTOS ----------
playBtn.addEventListener("click", play);
nextBtn.addEventListener("click", siguiente);

// ---------- FUNCIONES ----------
function toggleSorpresa(){
  modo=!modo;
  surpriseBox.classList.toggle("active");
}

function play(){
  total = Number(jugadores.value);
  let cant = Number(impostores.value);

  if(cant >= total){
    alert("Impostors must be less than players");
    return;
  }

  palabra = objetos[Math.floor(Math.random()*objetos.length)];

  imps = [];

  // MODO SURPRISE: 5% chance ALL IMPOS
  if(modo && Math.random() < 0.05){
    for(let i=0;i<total;i++) imps.push(i);
  } else {
    while(imps.length < cant){
      let r = Math.floor(Math.random()*total);
      if(!imps.includes(r)) imps.push(r);
    }
  }

  config.style.display="none";
  pantalla.style.display="flex";
  nextBtn.style.visibility="visible";
  roleBadge.style.display="none";

  jugador=0;
  mostrando=false;

  document.querySelector("h1").innerText="Player 1";
  pantalla.innerText="1";
  nextBtn.innerText="REVEAL";
}

function siguiente(){
  pantalla.className="card";

  if(!mostrando){
    if(imps.includes(jugador)){
      roleBadge.style.display="block";
      pantalla.innerHTML=
        "<div class='hintTitle'>HINT</div>"+
        "<div class='hintText'>"+palabra.tema+"</div>";
    } else {
      roleBadge.style.display="none";
      pantalla.innerText=palabra.nombre;
    }
    nextBtn.innerText="NEXT";
    mostrando=true;
  } else {
    jugador++;
    mostrando=false;
    roleBadge.style.display="none";

    if(jugador < total){
      document.querySelector("h1").innerText="Player "+(jugador+1);
      pantalla.innerText=jugador+1;
      nextBtn.innerText="REVEAL";
    } else {
      nextBtn.style.visibility="hidden";
      pantalla.style.display="none";
      config.style.display="block";
      roleBadge.style.display="none";
      document.querySelector("h1").innerText="Impostor Game";
    }
  }
}
